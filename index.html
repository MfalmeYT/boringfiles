function hero(all,s){const ks=Object.keys(D),er=ks.filter(k=>D[k].some(r=>r.a==="error"&&NW()-r.t<36e5)).length,op=ks.filter(k=>(D[k][D[k].length-1]||{}).pos==="yes").length;return`<div class="card hero">${ring(s)}<div><div class="mut">Total return · all markets · after fees</div><div class="big ${s.tot>=0?"good":"bad"}" id="bt" data-v="${s.n?s.tot:""}">${s.n?(s.tot>=0?"+":"")+s.tot.toFixed(2)+"%":"No closed trades yet"}</div><div class="mut">${s.n} trades · ${s.wr} win rate · ${op} open now</div></div><span class="pill ${er?"p-bad":"p-good"}">${er?er+" market"+(er>1?"s":"")+" with errors":"All systems running"}</span></div>`}

function overview(){const ks=Object.keys(D),per=ks.map((k,i)=>({k,c:PAL[i%PAL.length],d:pair(inR(D[k]),FEE[k]).done})),all=per.flatMap(x=>x.d).sort((a,b)=>a.t1-b.t1),s=st(all),lo=st(all.filter(t=>t.dir>0)),sh=st(all.filter(t=>t.dir<0));

<h2>Highlights</h2>${insights(per,all)}${extra(per,all)}<h2>24-hour race · price change of every market since yesterday</h2><div class="card">${race()}</div><h2>Cumulative return after fees</h2><div class="card">${chart("ov",[{n:"Combined",c:"var(--fg)",w:3,dash:1,p:eq(all)},...per.map(x=>({n:LB[x.k],c:x.c,p:eq(x.d)}))],[],{zero:1,f:v=>v.toFixed(2)+"%"})}</div>
<h2>By market</h2><div class="card sc"><table><tr><th>Market</th><th>Runs</th><th>Trades</th><th>Win</th><th>After fees</th><th>Now</th><th>Errors</th></tr>${rows}</table></div><div class="mut" style="margin-top:6px">Tap a market for its full page. Fees: Alpaca crypto (Bitcoin, Gold) 0.25% per order, so 0.5% for a buy plus a sell; currency pairs 0 (the spread is their cost). Each market page has a fee box you can change.</div><h2>Latest trades</h2><div class="card">${ev||'<span class="mut">Nothing yet.</span>'}</div>`}
/* ---- one market ---- */
function market(k){const rows=inR(D[k]);if(!rows.length)return'<p class="mut">No rows in this range.</p>';const fee=FEE[k],{done,op}=pair(rows,fee),s=st(done),sh=done.filter(t=>t.dir<0),lo=done.filter(t=>t.dir>0),cnt={};rows.forEach(r=>cnt[r.a]=(cnt[r.a]||0)+1);
const pr=rows.filter(r=>!isNaN(r.price)),dots=rows.filter(r=>["buy","short","sell","cover"].includes(r.a)&&!isNaN(r.price)).map(r=>[r.t,r.price,r.a==="buy"||r.a==="short"?"#16a34a":"#dc2626",LAB[r.a]+" "+px(r.price)+" · "+r.note]);
const w=done.filter(t=>t.ret>0),l=done.filter(t=>t.ret<=0),gw=sum(w.map(t=>t.ret)),gl=-sum(l.map(t=>t.ret));let c=0,pk=0,dd=0;done.forEach(t=>{c+=t.ret;pk=Math.max(pk,c);dd=Math.min(dd,c-pk)});
const grp=f=>{const o={};done.forEach(t=>{(o[f(t)]=o[f(t)]||[]).push(t.ret)});return o},tbl=(o,h)=>`<table><tr><th>${h}</th><th>Trades</th><th>Win</th><th>Avg</th></tr>${Object.keys(o).sort().map(n=>{const v=o[n];return`<tr><td>${esc(n)}</td><td>${v.length}</td><td>${Math.round(v.filter(x=>x>0).length/v.length*100)}%</td><td>${pc(sum(v)/v.length)}</td></tr>`}).join("")}</table>`;
const ex=grp(t=>(t.why||"").split(/[(;]/)[0].replace(/,? ?score.*/,"").trim()||"other"),dr=grp(t=>t.dir<0?"Short":"Long"),cf=grp(t=>"Confidence "+t.conf);
const f=rows.filter(r=>["no_trade","gemini_hold","error"].includes(r.a)),why={};f.forEach(r=>{const q=r.a==="gemini_hold"?"Gemini passed ("+((/conf (\d)/.exec(r.note)||[])[0]||"conf ?")+")":r.a==="error"?"Error: "+r.note.replace(/\d{4,}/g,"#").slice(0,50):(r.note.split("|")[0].replace(/\$[\d.,]+/g,"$X").replace(/\d+ min/,"N min").trim().slice(0,50)||"no trade");why[q]=(why[q]||0)+1});
const wt=Object.entries(why).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([q,n])=>`<tr><td>${esc(q)}</td><td>${n}</td><td>${Math.round(n/f.length*100)}%</td></tr>`).join("");
const er={};rows.filter(r=>r.a==="error").forEach(r=>{const q=r.note.replace(/\d{5,}/g,"#").slice(0,90),g=er[q]=er[q]||{n:0,a:r.t,b:r.t};g.n++;g.b=r.t});
const eh=Object.entries(er).sort((a,b)=>b[1].n-a[1].n).map(([q,g])=>`<div class="ev"><span class="b error">×${g.n}</span>${esc(q)}<div class="n">${fmt(g.a)} to ${fmt(g.b)}</div></div>`).join("")||'<span class="mut">No errors 🎉</span>';
const list=rows.filter(r=>show.has(r.a)).reverse(),evh=list.slice(0,lim).map(r=>`<div class="ev"><span class="mut">${fmt(r.t)}</span><span class="b ${r.a}">${LAB[r.a]||esc(r.a)}</span>${isNaN(r.price)?"":px(r.price)} <span class="mut">score ${esc(r.score)}</span>${r.note||r.fail?`<div class="n">${esc(r.note)}${(r.a==="no_trade"||r.a==="gemini_hold")&&r.fail?" · failing: "+esc(r.fail.replace(/\|/g,", ")):""}</div>`:""}</div>`).join("");
const trs=done.slice().reverse().slice(0,50).map(t=>`<tr><td>${fmt(t.t0)}</td><td class="${t.dir<0?"short":"buy"}">${t.dir<0?"Short":"Long"}</td><td>${fmt(t.t1)}</td><td>${px(t.p0)}</td><td>${px(t.p1)}</td><td>${pc(t.ret)}</td><td>${esc(t.why)}</td></tr>`).join("");
return`<div class="row" style="margin-top:6px"><label class="mut">Fee per side %: <input id="fee" type="number" step=".05" min="0" style="width:72px" value="${fee}"></label></div><h2>Results</h2><div class="grid">${kpi(s.n,"closed trades")}${kpi(s.wr,"win rate")}${kpi(s.n?pc(s.tot):"–","total")}${kpi(s.n?pc(s.avg):"–","avg per trade")}${kpi(gl?(gw/gl).toFixed(2):"–","profit factor")}${kpi(pc(dd),"max drawdown")}${kpi(lo.length+" / "+sh.length,"long / short")}${kpi(cnt.error||0,"errors")}</div>${op?`<div class="mut" style="margin-top:6px">Open now: ${op.dir<0?"shorted":"bought"} ${fmt(op.t)} at ${px(op.p)}</div>`:""}${s.n&&s.n<30?`<div class="mut" style="margin-top:6px">Only ${s.n} closed trade${s.n==1?"":"s"}: too few to judge win rate.</div>`:""}
<h2>Price (hover for details, dots are trades)</h2><div class="card">${chart("px",[{n:"Price",c:"var(--acc)",p:thin(pr).map(r=>[r.t,r.price])}],dots,{f:px})}</div>
<h2>Cumulative return after fees</h2><div class="card">${chart("eq",[{n:"Return",c:"var(--good)",p:eq(done)}],[],{zero:1,f:v=>v.toFixed(2)+"%"})}</div>
${done.length?`<h2>Trades</h2><div class="card sc"><table><tr><th>Opened</th><th>Type</th><th>Closed</th><th>In</th><th>Out</th><th>Result</th><th>Why closed</th></tr>${trs}</table></div><h2>Insights</h2><div class="g2"><div class="card sc">${tbl(dr,"Direction")}</div><div class="card sc">${tbl(cf,"Gemini confidence")}</div><div class="card sc">${tbl(ex,"Exit reason")}</div></div>`:""}
${wt?`<h2>Why it isn’t trading</h2><div class="card sc"><table><tr><th>Reason</th><th>Runs</th><th>Share</th></tr>${wt}</table></div>`:""}<h2>Errors, grouped</h2><div class="card">${eh}</div>
<h2>Events</h2><div class="row">${ACTS.map(a=>`<button class="chip ${show.has(a)?"on":""}" data-a="${a}">${LAB[a]} (${cnt[a]||0})</button>`).join("")}</div><div style="margin-top:6px">${evh||'<span class="mut">Nothing matches.</span>'}</div>${list.length>lim?`<div class="row"><button class="btn g" id="more">Show more (${list.length-lim} left)</button></div>`:""}`}
/* ---- report tab: the same file Claude reads ---- */
function report(){return`<h2>Report for Claude</h2><div class="card"><div class="mut">The bot rewrites this file every run. To get help, just tell Claude to read it: <code>https://raw.githubusercontent.com/${REPO}/main/report.md</code></div><div class="row" style="margin:8px 0"><button class="btn" id="cp">Copy report</button><a class="btn g" style="text-decoration:none" href="https://github.com/${REPO}/blob/main/report.md" target="_blank">Open on GitHub</a></div><pre>${esc(rep||"report.md not found yet. It appears after the next bot run with the new files uploaded.")}</pre></div>`}
/* ---- briefing (Gemini) ---- */
function md(t){let o="",li=0;for(const l of String(t).split(/\n/)){const x=esc(l.trim()).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>"),m=/^[*\-•\d.]+\s+(.*)$/.exec(x);if(m){if(!li){o+="<ul>";li=1}o+=`<li>${m[1]}</li>`}else{if(li){o+="</ul>";li=0}if(x){const h=/^#{1,6}\s+(.*)$/.exec(x);o+=h?`<p><b>${h[1]}</b></p>`:`<p>${x}</p>`}}}return o+(li?"</ul>":"")}
let bi=0;const bh=()=>{try{return JSON.parse(lg("brief_hist")||"[]")}catch(e){return[]}};
function bshow(){const h=bh(),e=h[bi],o=$("bout");if(!o)return;o.innerHTML=e?`<div class="mut">${esc(new Date(e.ts).toLocaleString())} · ${bi+1} of ${h.length}</div>`+md(e.text):'<span class="mut">No briefing yet. Press Generate.</span>';const p=$("bp"),n=$("bn");if(p)p.disabled=bi>=h.length-1;if(n)n.disabled=bi<=0}
function brief(){const k=lg("gkey");return`<div class="card"><div class="row"><input type="password" id="gkey" placeholder="Gemini API key (stays on this device)" value="${k?"••••••••":""}" style="flex:1;min-width:180px"><button class="btn" id="bgo">Generate briefing</button></div><div class="row" style="margin-top:8px"><button class="chip" id="bp" title="Older">◀</button><button class="chip" id="bn" title="Newer">▶</button></div><div class="md" id="bout" style="margin-top:8px"></div></div>`}
function bPrompt(){const o={range:rng,markets:{}};Object.keys(D).forEach(k=>{const r=inR(D[k]),d=pair(r,FEE[k]).done,cnt={},er={};r.forEach(x=>cnt[x.a]=(cnt[x.a]||0)+1);r.filter(x=>x.a==="error"&&NW()-x.t<864e5).forEach(x=>{const m=x.note.slice(0,70);er[m]=(er[m]||0)+1});o.markets[LB[k]]={runs:r.length,actions:cnt,fee_per_side_pct:FEE[k],long_returns_pct:d.filter(x=>x.dir>0).map(x=>+x.ret.toFixed(2)),short_returns_pct:d.filter(x=>x.dir<0).map(x=>+x.ret.toFixed(2)),top_errors_last_24h:er,recent_gemini_passes:r.filter(x=>x.a==="gemini_hold").slice(-2).map(x=>x.note)}});
const sm=/## Settings[^\n]*\n([\s\S]*?)\n## /.exec(rep);return"You are reviewing a paper-trading bot. Its real settings, read from its code:\n"+(sm?sm[1]:"(unavailable)")+"\nReturns are % after fees (Alpaca crypto 0.25% per order, currency pairs 0). The four currency pairs use identical settings, so judge them as ONE pooled sample; Bitcoin and Gold are each their own sample. Errors are listed for the last 24 hours only; anything older may already be fixed, so do not treat it as a current problem. Judge only what the data shows. Under ~30 closed trades in a sample means win rate is unreliable, but you may still point out clear mechanical problems (fees larger than the average gain, exits that fire before the target) and say how sure you are.\n"+JSON.stringify(o)+"\nWrite under 220 words: 1) plain summary, 2) what worked or failed (compare long vs short), 3) up to 3 concrete settings to try with reasons, only if the sample supports it. No hype."}
async function runBrief(){const i=$("gkey"),v=i?i.value.trim():"";if(v&&!/^•+$/.test(v))ls("gkey",v);const k=lg("gkey"),o=$("bout");if(!k){o.textContent="Paste your Gemini API key first.";return}o.innerHTML='<span class="mut">Thinking…</span>';
try{const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":k},body:JSON.stringify({contents:[{parts:[{text:bPrompt()}]}],generationConfig:{thinkingConfig:{thinkingLevel:"low"}}})});if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json(),t=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||"").join("");if(!t.trim())throw new Error("empty reply");const h=bh();h.unshift({ts:Date.now(),text:t});ls("brief_hist",JSON.stringify(h.slice(0,60)));bi=0;bshow()}catch(e){o.textContent="Couldn’t get a briefing ("+e.message+"). Needs the downloaded copy of this page."}}
/* ---- shell ---- */
function render(){cut();document.body.classList.toggle("an",an);tick();sbar();const ks=Object.keys(D),y=scrollY;if(tab!=="all"&&tab!=="report"&&!D[tab])tab="all";
$("tabs").innerHTML=["all",...ks,"report"].map(k=>`<button class="chip ${tab===k?"on":""}" data-t="${k}">${k==="all"?"Overview":k==="report"?"Report":esc(LB[k])}</button>`).join("");
$("rng").innerHTML=tab==="report"?"":[["today","Today"],["7d","7 days"],["all","All time"]].map(([k,n])=>`<button class="chip ${rng===k?"on":""}" data-r="${k}">${n}</button>`).join("");
$("out").innerHTML=tab==="all"?overview():tab==="report"?report():market(tab);wire();
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;lim=80;an=true;render();scrollTo(0,0)});document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{rng=b.dataset.r;an=true;render()});

const ex=$("exp");if(ex)ex.onclick=exportCsv;const m=$("more");if(m)m.onclick=()=>{lim+=150;render()};const f=$("fee");if(f)f.onchange=()=>{FEE[tab]=Math.max(0,parseFloat(f.value)||0);render()};
const b=$("bgo");if(b)b.onclick=runBrief;const c=$("cp");if(c)c.onclick=()=>{navigator.clipboard.writeText(rep).then(()=>c.textContent="Copied ✓")};bshow();const bp=$("bp"),bn=$("bn");if(bp)bp.onclick=()=>{bi++;bshow()};if(bn)bn.onclick=()=>{bi--;bshow()};post();an=false;scrollTo(0,y)}
function add(name,text){const n=MK[name.replace(/ ?\(\d+\)/,"")];if(!n)return;FULL[n[0]]=D[n[0]]=parse(text);LB[n[0]]=n[1];if(!(n[0] in FEE))FEE[n[0]]=n[2]}
function stamp(okk){$("live").innerHTML=`<i class="dot${okk?"":" off"}"></i>${okk?"Live":"Offline"} · ${new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}`}
async function load(first){LT=Date.now();let got=0,ch=false;const u=f=>`https://raw.githubusercontent.com/${REPO}/main/${f}?t=${Date.now()}`;
await Promise.all([...Object.keys(MK),"report.md","data/account.csv"].map(async f=>{try{const r=await fetch(u(f));if(!r.ok)return;const t=await r.text();if(f==="report.md"){if(rep!==t){rep=t;ch=true}return}if(f==="data/account.csv"){if(ACC!==t){ACC=t;ch=true}return}got++;if(raw[f]!==t){raw[f]=t;add(f,t);ch=true}}catch(e){}}));
if(first&&got)$("smsg").textContent=`Loaded ${got} log files`;stamp(!!got);if(got&&(ch||first)){ok=true;render();$("splash").classList.add("hide")}
if(!got&&first&&!ok){$("sp").style.display="none";$("smsg").textContent="";$("sfail").style.display="block"}}

load(true);setInterval(()=>load(false),60000);
